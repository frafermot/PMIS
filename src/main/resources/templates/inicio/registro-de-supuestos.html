<p><strong>SUPUESTOS/RESTRICCIONES</strong>&nbsp;</p>
<figure class="table">
    <table>
        <tbody>
            <tr>

            <tr>
                <td><strong>1</strong>&nbsp;</td>
                <td>
                    <p><i>Los supuestos son factores que, para propósitos de planificación, se consideran verdaderos,
                            reales o ciertos sin requerir prueba o demostración. Son condiciones o situaciones que se
                            asumen como válidas para poder avanzar con la planificación del proyecto.</i>&nbsp;</p>
                    <p><i>Características de los supuestos:</i>&nbsp;</p>
                    <p><i>Se basan en información histórica, experiencia previa o juicio experto.</i>&nbsp;</p>
                    <p><i>Pueden cambiar durante el ciclo de vida del proyecto.</i>&nbsp;</p>
                    <p><i>Conllevan un nivel de riesgo si resultan ser incorrectos.</i>&nbsp;</p>
                    <p><i>Deben ser documentados y validados regularmente.</i>&nbsp;</p>
                    <p><i>Ejemplos: "Los recursos estarán disponibles cuando se necesiten", "El proveedor entregará los
                            materiales a tiempo", "No habrá cambios significativos en la regulación durante el
                            proyecto".</i>&nbsp;</p>
                    <p><i>Las restricciones son factores limitantes que afectan la ejecución de un proyecto, actividad o
                            proceso. Son condiciones que limitan las opciones del equipo de proyecto.</i>&nbsp;</p>
                    <p><i>Características de las restricciones:</i>&nbsp;</p>
                    <p><i>Son factores que no pueden ser modificados fácilmente por el equipo del proyecto.</i>&nbsp;
                    </p>
                    <p><i>Establecen límites dentro de los cuales debe operar el proyecto.</i>&nbsp;</p>
                    <p><i>Ejemplos: Presupuesto fijo, fecha límite establecida, recursos específicos disponibles,
                            regulaciones gubernamentales, limitaciones tecnológicas.</i>&nbsp;</p>
                </td>
                <td><i>Es la persona asignada para monitorear, validar y gestionar un supuesto o restricción específico
                        durante el ciclo de vida del proyecto.</i>&nbsp;</td>
                <td>
                    <p><i>Indica la fecha hasta la cual se considera válido.</i>&nbsp;</p>
                    <p><i>&nbsp;</i>&nbsp;</p>
                </td>
                <td>
                    <p><i>Valores típicos:</i>&nbsp;</p>
                    <p><i>Activo</i>&nbsp;</p>
                    <p><i>Validado</i>&nbsp;</p>
                    <p><i>Invalidado</i>&nbsp;</p>
                    <p><i>Falso</i>&nbsp;</p>
                    <p><i>En revisión</i>&nbsp;</p>
                    <p><i>Pendiente de validación</i>&nbsp;</p>
                    <p><i>Requiere verificación adicional</i>&nbsp;</p>
                    <p><i>Cerrado</i>&nbsp;</p>
