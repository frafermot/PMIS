version: '3.8'

services:

  db:
    image: mysql:8.4

    container_name: tfg-mysql

    environment:
      MYSQL_DATABASE: tfgdb
      MYSQL_USER: tfguser
      MYSQL_PASSWORD: tfgpassword
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

  app:
    build: .

    container_name: tfg-app

    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}

    restart: always

volumes:
  mysql_data: